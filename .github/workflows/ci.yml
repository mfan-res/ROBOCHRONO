name: tests

on:
  push:
    branches: [release, main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Build the tf4 environment
        run: |
          uv python install 3.11
          UV_PROJECT_ENVIRONMENT=.venvs/tf4 uv sync --extra tf4 --frozen
      - name: Run the tests that need neither dataset nor GPU
        # Two tests are excluded because they assert against the downloaded
        # scenario pool, which CI does not have: test_matrix.py and
        # test_preflight.py. Everything else either needs no data at all or
        # skips itself cleanly with a printed reason when data is absent —
        # in particular, test_runtime_equivalence.py prints
        # "skip: reference implementation not found" here, because it
        # compares against a private pre-release implementation that is not
        # part of this repository. That skip is expected, not a failure.
        run: |
          set -e
          for t in tests/test_*.py; do
            case "$t" in
              tests/test_matrix.py|tests/test_preflight.py) 
                echo "== $t (skipped in CI: asserts against the dataset)";;
              *)
                echo "== $t"
                .venvs/tf4/bin/python "$t";;
            esac
          done
